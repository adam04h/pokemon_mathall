   if(/[A-Za-z]/.test(main[i]))positions.push(i);
 }
 const n=Math.min(blankCount(main),positions.length);
 // 固定但分散的挖空位置，避免每次重繪時答案位置亂跳。
 const hidden=new Set();
 for(let k=0;k<n;k++){
   const pos=Math.floor((k+1)*positions.length/(n+1));
   hidden.add(positions[Math.min(pos,positions.length-1)]);
 }
 const masked=[...main].map((ch,i)=>hidden.has(i)?"_":ch).join("");
 return masked+suffix;
}

let voiceIndex=0;
function getEnglishVoices(){
  if(!("speechSynthesis" in window)) return [];
  const voices=speechSynthesis.getVoices();
  const gb=voices.filter(v=>/^en-GB/i.test(v.lang));
  const en=voices.filter(v=>/^en(-|[-_])/i.test(v.lang));
  return gb.length?gb:en;
}

function speak(word){
  if(!("speechSynthesis" in window) || !window.SpeechSynthesisUtterance) return;
  const text=String(word||"").trim();
  if(!text)return;
  try{
    const synth=window.speechSynthesis;
    synth.cancel();
    synth.resume();
    const voices=getEnglishVoices();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="en-GB";
    u.rate=.72;
    u.pitch=1.0;
    if(voices.length){
      u.voice=voices[voiceIndex % voices.length];
      voiceIndex++;
      u.lang=u.voice.lang || "en-GB";
    }
    synth.speak(u);
  }catch(e){}
}

// 小學生答題音效：使用 Web Audio API，不依賴外部音檔；電腦與手機都可在使用者點擊/送出答案時播放。
let audioCtx=null;
function getAudioContext(){
  if(audioCtx) return audioCtx;
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx) return null;
    audioCtx=new Ctx();
    return audioCtx;
  }catch(e){ return null; }
}
function unlockAudio(){
  const ctx=getAudioContext();
  if(!ctx) return null;
  try{ if(ctx.state==="suspended") ctx.resume(); }catch(e){}
  return ctx;
}
function tone(ctx,freq,start,duration,type="sine",gain=.055){
  try{
    const osc=ctx.createOscillator(), g=ctx.createGain();
    osc.type=type; osc.frequency.setValueAtTime(freq,start);
    g.gain.setValueAtTime(.0001,start);
    g.gain.exponentialRampToValueAtTime(gain,start+.012);
    g.gain.exponentialRampToValueAtTime(.0001,start+duration);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(start); osc.stop(start+duration+.02);
  }catch(e){}
}
function playCorrectSound(){
  const ctx=unlockAudio();
  if(!ctx) return;
  const t=ctx.currentTime+.015;
  // 歡樂答對音：三音上行 + 高音收尾
  tone(ctx,523.25,t,.13,"sine",.065);
  tone(ctx,659.25,t+.11,.13,"sine",.065);
  tone(ctx,783.99,t+.22,.18,"sine",.07);
  tone(ctx,1046.50,t+.34,.24,"triangle",.055);
}
function playWrongSound(){
  const ctx=unlockAudio();
  if(!ctx) return;
  const t=ctx.currentTime+.015;
  // 溫和但明顯的答錯音，不刺耳
  tone(ctx,220,t,.18,"sawtooth",.045);
  tone(ctx,174.61,t+.15,.24,"sawtooth",.04);
}
if("speechSynthesis" in window){
  speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();
}

function getCats(){return [...new Set(WORDS.map(x=>x.category))]}

function tabs(){
  document.getElementById("tabs").innerHTML=getCats().map(x=>
    `<button class="tab ${active===x?"active":""}" data-v="${esc(x)}">${esc(x)}</button>`
  ).join("");
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
    active=b.dataset.v;
    tabs();
    render();
  });
}

function row(w,idx){
 const blank=makeBlankWord(w.word,idx);
 return `<div class="word-row ${w.star?"important":""}" data-i="${idx}" data-stage="answer">
   <div class="star">★</div>
   <div class="word-area"><div class="word blank-word">${esc(blank)}</div><div class="source">${esc(w.part)}</div></div>
   <button class="speak" title="播放發音" aria-label="播放英文發音">🔊</button>
   <input class="answer" placeholder="輸入完整英文" autocomplete="off" autocapitalize="none" spellcheck="false">
   <button class="check" title="檢查">✓</button>
   <div class="status"></div>
 </div>`;
}
function render(){
 const list=(active?WORDS.filter(x=>x.category===active):WORDS).filter(x=>x && String(x.word||"").trim()), groups=[];
 list.forEach(w=>{let g=groups.find(x=>x.part===w.part);if(!g){g={part:w.part,items:[]};groups.push(g)}g.items.push(w)});
 document.getElementById("app").innerHTML=groups.map(g=>`<section class="section"><div class="section-head"><div class="section-title">${esc(g.part)}</div><div class="count">${g.items.length} 個單字</div></div><div class="words">${g.items.map(w=>row(w,WORDS.indexOf(w))).join("")}</div></section>`).join("");
 document.querySelectorAll(".word-row").forEach(r=>{
   const w=WORDS[+r.dataset.i], input=r.querySelector(".answer"), check=r.querySelector(".check"), status=r.querySelector(".status"), speakBtn=r.querySelector(".speak"), wordEl=r.querySelector(".word");
   speakBtn.addEventListener("click",e=>{e.preventDefault();speak(w.word);},{passive:false});
   ["copy","cut","dragstart","contextmenu","selectstart"].forEach(evt=>wordEl.addEventListener(evt,e=>e.preventDefault()));

   const verify=()=>{
     // verify 由按鈕點擊或 Enter 觸發，正好是手機允許 Web Audio 播放的使用者操作時機。
     unlockAudio();
     const yes=okEnglish(input.value,w.word);
     if(yes){
       check.className="check correct"; check.textContent="✓";
       status.className="status correct"; status.textContent="答對了！🎉 太棒了！⭐";
       input.disabled=true;
       input.classList.add("english-done");
       playCorrectSound();
       if(!done.has(+r.dataset.i)){done.add(+r.dataset.i);correct++;}
     }else{
       check.className="check wrong"; check.textContent="✕";
       status.className="status wrong"; status.textContent="再試一次！💪 也可以按 🔊 再聽一次。";
       playWrongSound();
     }
   };
   check.onclick=verify;
   input.onkeydown=e=>{if(e.key==="Enter")verify()};
 });
}

document.getElementById("total").textContent=`共 ${WORDS.length} 個單字／片語`;
document.getElementById("reset").onclick=()=>{
  done.clear();
  correct=0;
  render();
};

active=getCats()[0]||"";
tabs();
render();
</script>
